<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wealth Intelligence</title>
  <meta name="description" content="9 wealth frameworks for building high-leverage AI prompts. Pick a framework, add your context, copy the prompt into Claude.">
  <meta name="theme-color" content="#080808">

  <!-- Open Graph -->
  <meta property="og:title" content="Wealth Intelligence">
  <meta property="og:description" content="9 wealth frameworks for building AI prompts that think in millions, not hours.">
  <meta property="og:type" content="website">

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wealth IQ">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Space+Grotesk:wght@300;400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="header-eyebrow"><span>Prompt Builder</span></div>
      <h1>WEALTH<br><em>INTELLIGENCE</em></h1>
      <p class="header-sub">Select a framework → Fill your context → Copy the prompt</p>
    </header>

    <!-- Framework grid -->
    <section class="fw-grid" id="fwGrid" aria-label="Frameworks"></section>

    <!-- Builder -->
    <section class="builder" id="builderPanel" aria-live="polite">
      <div class="builder-header">
        <h2 class="builder-title" id="builderTitle"></h2>
        <div class="builder-id" id="builderId"></div>
      </div>
      <div id="fieldsContainer"></div>
      <div class="error-msg" id="errorMsg">↑ Fill in all fields to build your prompt.</div>
      <button type="button" class="build-btn" id="buildBtn">◈ BUILD PROMPT</button>
      <span class="kbd-hint">or Ctrl / ⌘ + Enter</span>
    </section>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon" aria-hidden="true">◈</div>
      <div class="empty-text">Select a framework above to begin</div>
    </div>

    <!-- Output -->
    <section class="output-panel" id="outputPanel" aria-live="polite">
      <div class="output-header">
        <div class="output-label"><span class="status-dot"></span>Prompt ready</div>
        <div class="output-actions">
          <button type="button" class="copy-btn" id="copyBtn">Copy Prompt</button>
          <button type="button" class="open-btn" id="openBtn">Open in Claude ↗</button>
        </div>
      </div>
      <div class="prompt-text" id="promptText"></div>
      <div class="prompt-arrows" id="promptArrows"></div>
      <div class="prompt-tagline" id="promptTagline"></div>
    </section>

    <footer class="footer">
      <span>Think in millions, not hours</span>
      <span id="fwCount">9 frameworks</span>
    </footer>
  </main>

  <script src="js/frameworks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
